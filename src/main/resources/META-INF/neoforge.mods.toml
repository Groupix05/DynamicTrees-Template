modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

issueTrackerURL="https://github.com/AuthorName/DynamicTreesTemplate/issues"
displayURL="https://www.curseforge.com/minecraft/mc-mods/dynamic-trees-template"
logoFile="logo.png"

authors="${mod_authors}"
description='''${mod_description}'''
credits='''${mod_credits}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dynamictrees"
    type="required"
    versionRange="[1.5.0-BETA5,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dynamictreesplus"
    type="optional"
    versionRange="[0.0,)"
    ordering="AFTER"
    side="BOTH"
